/v1/api/health:
  get:
    summary: Health check
    description: Returns service health status. Used by Docker Compose healthchecks.
    tags:
      - Health
    responses:
      200:
        description: Service is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: ok
